name: PHP Checks

on:
  push:
    branches: [ main, master ]
    # Вариант В
    paths:
      - '**.php'
      - 'phpcs.xml'
      - '.github/workflows/php-checks.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.php'
      - 'phpcs.xml'
      - '.github/workflows/php-checks.yml'

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -exec php -l {} \; | grep -v 'No syntax errors'
          echo 'PHP syntax check completed!'

  phpcs:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP with PHPCS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: phpcs, phpcbf

      # Вариант А
      - name: Auto-fix code style
        run: phpcbf --standard=PSR12 . || true

      - name: Run PHPCS
        run: phpcs -n --standard=PSR12 .
